<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MBG {{title}}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{description}}">
        <meta property="og:title" content="MBG {{title}}">
		<meta property="og:description" content="{{description}}">
		<meta property="og:url" content="{{url}}">
		<meta property="og:image" content="{{image}}">
		<meta property="og:type" content="website">
		<link rel="canonical" href="{{url}}">
        <link rel="icon" href="/media/mbglogo.png" type="image/png">
        <link rel="stylesheet" href="/css/discord.css">
        <style>
            footer {
				background-color: #202225;
                border-radius: 20px;
                box-shadow: inset 0 0 0 3000px rgba(40, 43, 48, 1);
                margin-top: 20px;
				text-align: center;
				font-size: 0.9em;
				color: #888;
			}
            footer p {
                padding: 10px 0;
            }
            a {
				color: #ff9a67;
                font-weight: bold;
			}
            a:link, a:visited, a:active {
				text-decoration: none;
			}
			footer a:hover {
				text-decoration: underline;
			}
        </style>
    </head>
    <body>
        <main class="main">
            <div class="background">
                <div class="inner inner-1"></div>
                <div class="inner inner-2"></div>
                <div class="inner inner-3"></div>
                <div class="inner inner-4"></div>
                <div class="inner inner-5"></div>
                <div class="inner inner-6"></div>
                <div class="inner inner-7"></div>
                <div class="inner inner-8"></div>
                <div class="inner inner-9"></div>
                <div class="inner inner-10"></div>
                <div class="inner inner-11"></div>
                <div class="inner inner-12"></div>
                <div class="inner inner-13"></div>
            </div>
            <div class="overlay">
                <div id="inviteContainer">
                    <div class="logoContainer">
                        <img class="logo" src="/media/mbglogo.png" alt="Discord logo">
                        <h1 class="text">MBG<br>Playground</h1>
                    </div>
                    <div class="acceptContainer">
                        <div class="divForm">
                            <h1>YOU'VE BEEN INVITED TO JOIN</h1>
                            <div class="serverInfo">
                                <h2>
                                <span class="server">MBG Playground</span><br>
                                <span class="by">by </span>
                                <span class="name">MBG</span>
                                </h2>
                            </div>
                            <a href="https://discord.gg/FkhPhkJ7JB"><button class="acceptBtn">Accept Invite</button></a>
                        </div>
                    </div>
                </div>
                <footer>
                    {{license}}
                </footer>
            </div>
        </main>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script async src="{{onloadJs}}"></script>
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGJJZV6FJE"></script>
		<script async src="/js/googletag.js"></script>
        
        <audio id="easteregg" src="/media/easteregg.mp3" preload="auto"></audio>
		<script async src="/js/easteregg.js"></script>
    </body>
</html>
