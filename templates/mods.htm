<!DOCTYPE html>
<html lang="en">
	<head>
		<title>MBG {{title}}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{description}}">
		<link rel="icon" href="/media/mbglogo.png" type="image/png">
		<link rel="stylesheet" href="/css/game.css">
	</head>
	<body>
		<canvas id="dust"></canvas>
		<div class="container">
			<div class="section">
				<h1>MBG {{title}}</h1>
				<p>{{description}}</p>
			</div>
			<div class="section">
				<h1>Mod Collection</h1>
				{{modList}}
			</div>
		</div>
		<footer>
			{{license}}
			{{poweredBy}}
		</footer>
		<script async src="/js/dust.js"></script>
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGJJZV6FJE"></script>
		<script async src="/js/googletag.js"></script>

		<audio id="easteregg" src="/media/easteregg.mp3" preload="auto"></audio>
		<script async src="/js/easteregg.js"></script>
	</body>
</html>
