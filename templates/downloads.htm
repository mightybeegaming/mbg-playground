<!DOCTYPE html>
<html lang="en">
	<head>
		<title>MBG {{title}}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{description}}">
		<link rel="icon" href="/media/mbglogo.png" type="image/png">
		<link rel="stylesheet" href="/css/game.css">
		<link rel="stylesheet" href="/css/downloads.css">
	</head>
	<body>
		<canvas id="dust"></canvas>
		<div class="container">
			<div class="section">
				<h1>MBG {{title}}</h1>
				<table class="file-table" id="fileTable">
					<thead>
						<tr>
							<th class="align-left"><span class="sort-label" onclick="sortTable(0)">Name</span> <span id="sort-indicator-0"></span></th>
							<th class="align-right"><span id="sort-indicator-1"></span> <span class="sort-label" onclick="sortTable(1)">Size</span></th>
							<th class="align-right"></th>
						</tr>
					</thead>
					<tbody>{{downloadList}}</tbody>
				</table>
			</div>
		</div>
	</body>
	<footer>
		{{license}}
		{{poweredBy}}
	</footer>
	<script async src="{{onloadJs}}"></script>
	<script async src="/js/dust.js"></script>
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGJJZV6FJE"></script>
	<script async src="/js/googletag.js"></script>

	<audio id="1up" src="/media/bonus1up.mp3" preload="auto"></audio>
	<script async src="/js/easteregg.js"></script>
</html>
