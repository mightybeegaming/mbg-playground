<!DOCTYPE html>
<html lang="en">
	<head>
		<title>MBG {{ title }}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{ description }}">
		<meta property="og:title" content="MBG {{ title }}">
		<meta property="og:description" content="{{ description }}">
		<meta property="og:url" content="{{ url }}">
		<meta property="og:image" content="{{ image }}">
		<meta property="og:type" content="website">
		<link rel="canonical" href="{{ url }}">
		<link rel="icon" href="/media/mbglogo.png" type="image/png">
		<link rel="stylesheet" href="/css/game.css">
	</head>
	<body>
		<!-- <canvas id="dust"></canvas> -->
		<div class="container">
			<div class="discord-container">
				<a href="/discord" class="discord-button" target="_blank">
					<img src="/media/discordlogo.png" alt="Discord Logo" class="discord-icon">
					Join Discord
				</a>
			</div>
			<div class="section">
				<h1>MBG {{ title }}</h1>
				<ul>
					<li>Our server is located in <b>Philippines</b>.</li>
					<li>Join our <b>Discord</b> server for more details.</li>
				</ul>
				<div class="line"></div>
                {{ features }}
				<div class="line"></div>
				<div class="tags" id="tags"></div>
			</div>
			<div class="section">
				<div class="info-grid">
					<div class="info-box"><b>Status</b><br><span class="highlight right-side" id="statusText"></span></div>
					<div class="info-box"><b>Uptime</b><br><span class="highlight right-side" id="uptime24"></span></div>
					<div class="info-box"><b>Online Players</b><br><span class="highlight right-side" id="onlinePlayers"></span></div>
					{{ infoBox }}
				</div>
			</div>
			<div class="auto-refresh">Auto Refresh: <span id="autoRefreshCountdown">00:00</span></div>
		</div>
		<footer>
			{{ navBar }}
			{{ license }}
			{{ poweredBy }}
		</footer>
		<script defer src="/js/_common.js"></script>
		<script defer src="{{ onloadJs }}"></script>
		<!-- <script defer src="/js/dust.js"></script> -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGJJZV6FJE"></script>
		<script async src="/js/googletag.js"></script>

		<audio id="easteregg" src="/media/easteregg.mp3" preload="auto"></audio>
		<script defer src="/js/easteregg.js"></script>
	</body>
</html>
